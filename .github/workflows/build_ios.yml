name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA (NetLich)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Flutter iOS
        run: |
          flutter pub get
          flutter build ios --config-only --release --no-codesign

      - name: Build with Xcode (No Code Signing)
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -sdk iphoneos \
                     -destination generic/platform=iOS \
                     -derivedDataPath build/ios_derived \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          APP_PATH=$(find build/ios_derived/Build/Products -name "Runner.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r NetLich.ipa Payload
          cd ../../..

      - name: Upload NetLich.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetLich-iOS-IPA
          path: build/ios/ipa/NetLich.ipa
          retention-days: 30
